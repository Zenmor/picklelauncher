name: Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release

  create_release:
    name: Create draft release
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      # The updater picks assets whose lowercase name contains "pickle-windows-msvc",
      # and "portable" for portable installs. Keep these names in sync with ARTIFACT_NAME in build.yml.
      - name: Name assets
        run: |
          set -euo pipefail
          mv Pickle-Windows-MSVC-Setup/PickleLauncher-Setup.exe "Pickle-Windows-MSVC-Setup-${VERSION}.exe"
          (cd Pickle-Windows-MSVC-Portable && zip -r -9 "../Pickle-Windows-MSVC-Portable-${VERSION}.zip" .)

      - name: Verify assets
        run: |
          set -euo pipefail
          zip="Pickle-Windows-MSVC-Portable-${VERSION}.zip"
          unzip -Z1 "$zip" | grep -qx 'picklelauncher.exe'
          unzip -Z1 "$zip" | grep -qx 'portable.txt'
          test -s "Pickle-Windows-MSVC-Setup-${VERSION}.exe"

      - name: Create draft release
        run: |
          cat > notes.md <<'EOF'
          Unsigned Windows x64 build, so Windows SmartScreen will warn on first run.

          - **Setup**: installer, installs per-user and keeps data in `%APPDATA%\PrismLauncher`.
          - **Portable**: unzip anywhere, keeps its data next to the exe.

          CurseForge downloads need your own API key under Settings.
          EOF
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Pickle Launcher ${VERSION}" \
            --notes-file notes.md \
            "Pickle-Windows-MSVC-Setup-${VERSION}.exe" \
            "Pickle-Windows-MSVC-Portable-${VERSION}.zip"
