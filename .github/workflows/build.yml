name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  build:
    name: Build (Pickle-Windows-MSVC)

    permissions:
      contents: read
      # Required for vcpkg binary cache
      packages: write

    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    env:
      # The updater matches release assets against this name, so it must stay in sync with the asset names in release.yml
      ARTIFACT_NAME: Pickle-Windows-MSVC-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: windows_msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: Pickle-Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Package
        uses: ./.github/actions/package/windows
        with:
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: Pickle-Windows-MSVC
